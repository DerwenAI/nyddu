[project]

name = "nyddu"
version = "0.2.0"
description = "spider-ish"

license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<4.0"

authors = [
    { name = "Paco Nathan", email = "paco@derwen.ai" }
]

dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "classy-fastapi (>=0.6,<1.0)",
    "defusedxml (>=0.7.1,<0.8)",
    "fastapi (>=0.115,<1.0)",
    "icecream (>=2.1,<3.0)",
    "kuzu (>=0.10,<=0.11)",
    "pandas (>=2.3,<4.0)",
    "polars (>=1.30,<2.0)",
    "pyarrow (>=20.0,<24.0)",
    "pydantic (>=2.11,<3.0)",
    "requests (>=2.32,<3.0)",
    "requests-cache (>=1.2,<2.0)",
    "selenium (>=4.34,<5.0)",
    "sentence-transformers (>=4.1,<6.0)",
    "tqdm (>=4.67,<5.0)",
    "uvicorn (>=0.35,<1.0)",
    "w3lib (>=2.3,<3.0)",
]


[build-system]

requires = [
    "poetry-core>=2.0.0,<3.0.0",
]

build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]

mypy = "^2.1"
pyinstrument = "^5.1.2"
pylint = "^4.0.5"
pytest = "^9.0.3"
types-defusedxml = "^0.7.0.20260504"
types-requests = "^2.33.0.20260518"
